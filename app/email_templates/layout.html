<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;">
    <span style="display:none;max-height:0;overflow:hidden;">{{preheader}}</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="580" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="background:{{brand_color}};padding:20px 28px;">
                <table role="presentation" cellpadding="0" cellspacing="0"><tr>
                  {{company_logo_html}}
                  <td style="color:#ffffff;font-size:16px;font-weight:bold;vertical-align:middle;">{{brand_name}}</td>
                </tr></table>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;">
                {{content_html}}
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px;background:#f8fafc;border-top:1px solid #e2e8f0;">
                <p style="margin:0;color:#94a3b8;font-size:11px;">{{footer_note}}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
